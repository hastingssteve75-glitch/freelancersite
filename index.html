<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FreelanceHub — Find Work, Hire Talent</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{
  --green:#14a800;--green-dark:#0e7a00;--green-light:#e8f7e5;
  --ink:#001e00;--slate:#5e6d55;--muted:#8a9a80;
  --bg:#f7f9f6;--card:#fff;--line:#e4ebe0;
  --gold:#f2b600;--red:#d93025;--blue:#0b66c3;
  --radius:14px;--shadow:0 4px 16px rgba(0,30,0,.06);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;min-height:100vh}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;font-size:1rem}
.hidden{display:none!important}
.nav{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:100}
.nav-inner{max-width:1240px;margin:0 auto;padding:.7rem 1.2rem;display:flex;align-items:center;gap:1.2rem;flex-wrap:wrap}
.brand{font-weight:800;font-size:1.4rem;color:var(--green);display:flex;align-items:center;gap:.4rem;letter-spacing:-.03em;cursor:pointer}
.brand i{font-size:1.3rem}
.nav-search{flex:1;min-width:180px;position:relative}
.nav-search input{width:100%;padding:.6rem .9rem .6rem 2.4rem;border:1px solid var(--line);border-radius:40px;background:var(--bg);outline:none;font-size:.9rem}
.nav-search input:focus{border-color:var(--green);background:#fff}
.nav-search i{position:absolute;left:.9rem;top:50%;transform:translateY(-50%);color:var(--muted);font-size:.85rem}
.nav-links{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap}
.nav-btn{padding:.5rem .9rem;border-radius:8px;font-weight:600;font-size:.88rem;color:var(--slate);transition:.15s;white-space:nowrap}
.nav-btn:hover{background:var(--green-light);color:var(--green-dark)}
.nav-btn.primary{background:var(--green);color:#fff}
.nav-btn.primary:hover{background:var(--green-dark)}
.nav-btn.ghost{border:1px solid var(--line)}
.badge-connects{background:var(--green-light);color:var(--green-dark);font-weight:700;padding:.35rem .7rem;border-radius:20px;font-size:.8rem;display:flex;align-items:center;gap:.3rem;white-space:nowrap}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;cursor:pointer;flex-shrink:0}
.page{max-width:1240px;margin:0 auto;padding:1.5rem 1.2rem 4rem;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.75rem 1.3rem;border-radius:30px;font-weight:600;font-size:.9rem;transition:.15s;white-space:nowrap}
.btn.primary{background:var(--green);color:#fff}
.btn.primary:hover{background:var(--green-dark)}
.btn.dark{background:var(--ink);color:#fff}
.btn.outline{border:1px solid var(--line);background:#fff;color:var(--ink)}
.btn.outline:hover{border-color:var(--green);color:var(--green)}
.btn.danger{background:var(--red);color:#fff}
.btn.sm{padding:.5rem .9rem;font-size:.82rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.block{width:100%}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:1.3rem;box-shadow:var(--shadow)}
.grid{display:grid;gap:1.2rem}
.grid-2{grid-template-columns:1fr}
.grid-3{grid-template-columns:1fr}
@media(min-width:760px){.grid-2{grid-template-columns:repeat(2,1fr)}.grid-3{grid-template-columns:repeat(3,1fr)}}
.field{margin-bottom:1rem}
.field label{display:block;font-weight:600;font-size:.85rem;margin-bottom:.35rem}
.field input,.field select,.field textarea{width:100%;padding:.7rem .9rem;border:1px solid var(--line);border-radius:10px;outline:none;transition:.15s;background:#fff}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px var(--green-light)}
.field textarea{resize:vertical;min-height:100px}
.field .hint{font-size:.78rem;color:var(--muted);margin-top:.3rem}
.job{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:1.2rem 1.3rem;transition:.15s;cursor:pointer}
.job:hover{border-color:var(--green);box-shadow:0 12px 28px rgba(0,30,0,.1);transform:translateY(-2px)}
.job h3{font-size:1.05rem;font-weight:700;margin-bottom:.4rem}
.job .meta{display:flex;flex-wrap:wrap;gap:.9rem;font-size:.8rem;color:var(--slate);margin-bottom:.6rem}
.job .meta i{color:var(--green);margin-right:.25rem}
.job .desc{font-size:.87rem;color:var(--slate);margin-bottom:.8rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.job .tags{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:.8rem}
.tag{background:var(--bg);border:1px solid var(--line);padding:.2rem .6rem;border-radius:20px;font-size:.72rem;font-weight:500;color:var(--slate)}
.job .foot{display:flex;justify-content:space-between;align-items:center;padding-top:.7rem;border-top:1px solid var(--line)}
.job .price{font-weight:700;font-size:1rem}
.job .price small{font-weight:400;color:var(--muted);font-size:.75rem}
.overlay{position:fixed;inset:0;background:rgba(0,30,0,.55);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:1.2rem;opacity:0;pointer-events:none;transition:.2s;z-index:1000}
.overlay.open{opacity:1;pointer-events:auto}
.modal{background:#fff;border-radius:20px;max-width:520px;width:100%;padding:1.8rem;box-shadow:0 20px 50px rgba(0,0,0,.2);max-height:92vh;overflow-y:auto;transform:scale(.95);transition:.2s}
.overlay.open .modal{transform:scale(1)}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.2rem}
.modal-head h2{font-size:1.4rem;font-weight:700;letter-spacing:-.02em}
.modal-close{width:36px;height:36px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--slate);font-size:1rem}
.modal-close:hover{background:var(--line)}
.pay-summary{background:var(--green-light);border-radius:12px;padding:1rem;margin-bottom:1.2rem;border-left:4px solid var(--green)}
.pay-summary .row{display:flex;justify-content:space-between;padding:.25rem 0;font-size:.9rem}
.wallet-box{background:var(--bg);border:1px dashed var(--muted);border-radius:12px;padding:1rem;margin-bottom:1rem;text-align:center}
.wallet-box .label{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.wallet-box .addr{font-family:monospace;font-size:.82rem;word-break:break-all;margin:.5rem 0;background:#fff;padding:.6rem;border-radius:8px;border:1px solid var(--line);font-weight:600}
.copy-btn{background:var(--ink);color:#fff;padding:.45rem .9rem;border-radius:20px;font-size:.78rem;font-weight:600;display:inline-flex;gap:.4rem;align-items:center}
.copy-btn:hover{background:#000}
.timer-box{display:flex;align-items:center;justify-content:center;gap:.6rem;background:#fff6e5;border:1px solid #ffd88a;border-radius:12px;padding:.9rem;margin-bottom:1rem;font-weight:700;color:#8a5a00}
.timer-box i{font-size:1.2rem}
.timer-box .time{font-family:monospace;font-size:1.4rem;letter-spacing:.05em}
.timer-box.expired{background:#ffe5e5;border-color:#ffb3b3;color:var(--red)}
.code-input{width:100%;padding:.9rem;border:2px solid var(--line);border-radius:12px;font-family:monospace;font-size:1.3rem;text-align:center;letter-spacing:.4em;font-weight:700;text-transform:uppercase;outline:none}
.code-input:focus{border-color:var(--green);box-shadow:0 0 0 3px var(--green-light)}
.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%) translateY(120px);background:var(--ink);color:#fff;padding:.85rem 1.6rem;border-radius:40px;font-weight:500;font-size:.9rem;box-shadow:0 20px 50px rgba(0,0,0,.2);transition:transform .3s cubic-bezier(.2,.9,.4,1);z-index:2000;display:flex;align-items:center;gap:.6rem;max-width:90vw}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast i{color:var(--gold)}
.tabs{display:flex;gap:.3rem;border-bottom:1px solid var(--line);margin-bottom:1.4rem;overflow-x:auto}
.tab{padding:.7rem 1.1rem;font-weight:600;font-size:.88rem;color:var(--slate);border-bottom:2px solid transparent;white-space:nowrap;transition:.15s}
.tab.active{color:var(--green);border-bottom-color:var(--green)}
.tab:hover{color:var(--green-dark)}
.profile-head{display:flex;gap:1.2rem;align-items:center;flex-wrap:wrap;margin-bottom:1.5rem}
.profile-avatar{width:80px;height:80px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:800;flex-shrink:0}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:.8rem;margin:1.2rem 0}
@media(min-width:600px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--bg);border-radius:12px;padding:.9rem;text-align:center}
.stat .n{font-size:1.4rem;font-weight:800;color:var(--green)}
.stat .l{font-size:.75rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.contract{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:1.2rem;margin-bottom:1rem}
.contract-head{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap;margin-bottom:.8rem}
.status-pill{padding:.25rem .7rem;border-radius:20px;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.status-pill.active{background:var(--green-light);color:var(--green-dark)}
.status-pill.escrow{background:#fff6e5;color:#8a5a00}
.status-pill.done{background:#e8eef7;color:var(--blue)}
.timer-run{display:flex;align-items:center;gap:1rem;background:var(--ink);color:#fff;border-radius:12px;padding:1rem 1.2rem;margin:1rem 0;flex-wrap:wrap}
.timer-run .clock{font-family:monospace;font-size:1.8rem;font-weight:700;letter-spacing:.04em}
.timer-run .pulse{width:10px;height:10px;border-radius:50%;background:var(--green);animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.escrow-bar{background:var(--bg);border-radius:10px;padding:.8rem 1rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.6rem;margin-top:.8rem}
.escrow-bar .amt{font-weight:800;color:var(--green);font-size:1.1rem}
.empty{text-align:center;padding:3rem 1rem;color:var(--muted)}
.empty i{font-size:3rem;color:var(--line);margin-bottom:1rem;display:block}
.empty h3{color:var(--slate);font-size:1.1rem;margin-bottom:.4rem}
.hero{background:linear-gradient(135deg,var(--ink) 0%,#003d00 100%);color:#fff;border-radius:24px;padding:3rem 2rem;margin-bottom:2rem;position:relative;overflow:hidden}
.hero h1{font-size:2.2rem;font-weight:800;letter-spacing:-.03em;margin-bottom:.8rem;line-height:1.15;max-width:600px}
.hero p{color:#b8d4b0;max-width:520px;margin-bottom:1.6rem;font-size:1.05rem}
@media(min-width:768px){.hero h1{font-size:3rem}.hero{padding:4rem 3rem}}
.search-row{display:flex;gap:.6rem;margin-bottom:1.5rem;flex-wrap:wrap}
.search-row input{flex:1;min-width:200px;padding:.8rem 1.1rem;border:1px solid var(--line);border-radius:40px;outline:none;background:#fff;font-size:.92rem}
.search-row input:focus{border-color:var(--green)}
.role-tabs{display:flex;gap:.5rem;margin-bottom:1.2rem}
.role-tabs button{flex:1;padding:.7rem;border-radius:10px;border:1px solid var(--line);font-weight:600;font-size:.9rem;background:#fff}
.role-tabs button.active{background:var(--green);color:#fff;border-color:var(--green)}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <div class="brand" onclick="router('home')"><i class="fas fa-infinity"></i>FreelanceHub</div>
    <div class="nav-search">
      <i class="fas fa-search"></i>
      <input id="navSearch" placeholder="Search for jobs..." onkeydown="if(event.key==='Enter'){router('jobs',{q:this.value})}">
    </div>
    <div class="nav-links" id="navLinks"></div>
  </div>
</nav>

<main id="app"></main>

<div class="overlay" id="overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal"></div>
</div>

<div class="toast" id="toast"><i class="fas fa-check-circle"></i><span id="toastMsg"></span></div>

<script>
/* ============================================================
   FREELANCEHUB — frontend-only clone (localStorage "backend")
   ============================================================ */

const CONFIG = {
  USDT_WALLET: 'TBf1BWj14SHSfvYgk5LGavNFGVhm2RqDnc',
  NETWORK: 'TRON (TRC20)',
  CONNECTS_PRICE: 100,
  TIMER_SECONDS: 300,
  CONNECT_COST: 4,
};

/* ---------- DB ---------- */
const DB = {
  get(k, def){ try{ const v = localStorage.getItem('fh_'+k); return v?JSON.parse(v):def; }catch(e){ return def; } },
  set(k, v){ localStorage.setItem('fh_'+k, JSON.stringify(v)); }
};

/* ---------- SEED ---------- */
function seed(){
  if(DB.get('seeded')) return;
  DB.set('users', {
    client1: { id:'client1', role:'client', name:'Acme Corp', email:'acme@demo.com', avatar:'AC', company:'Acme Corp', bio:'We build digital products.' },
    free1:   { id:'free1',   role:'freelancer', name:'Ada Lovelace', email:'ada@demo.com',  avatar:'AL', title:'Full-Stack Developer', bio:'10+ years building web apps.', skills:['JavaScript','React','Node.js','Python'], rate:45, connects:40, rating:4.9, jobsDone:47, earned:28400 },
    free2:   { id:'free2',   role:'freelancer', name:'Kofi Mensah',  email:'kofi@demo.com', avatar:'KM', title:'UI/UX Designer', bio:'Designing delightful experiences.', skills:['Figma','UI/UX','Prototyping'], rate:38, connects:20, rating:4.8, jobsDone:31, earned:19200 },
    free3:   { id:'free3',   role:'freelancer', name:'Zara Bello',   email:'zara@demo.com', avatar:'ZB', title:'Content Writer', bio:'Words that convert.', skills:['Copywriting','SEO','Blogs'], rate:30, connects:12, rating:5.0, jobsDone:58, earned:15600 },
  });
  DB.set('session', null);
  DB.set('jobs', [
    { id:'j1', clientId:'client1', title:'Build a React dashboard with charts', desc:'Need a responsive analytics dashboard with charts, filters, and API integration.', budget:1200, type:'Fixed', skills:['React','JavaScript','Charts'], posted:Date.now()-3600000*2, proposals:3, status:'open' },
    { id:'j2', clientId:'client1', title:'Design mobile app onboarding flow', desc:'Design a clean, modern onboarding flow for a fintech mobile app.', budget:600, type:'Fixed', skills:['Figma','UI/UX','Mobile'], posted:Date.now()-3600000*5, proposals:5, status:'open' },
    { id:'j3', clientId:'client1', title:'SEO blog content — 10 articles', desc:'Write 10 SEO-optimized blog articles (1200 words each) on fintech topics.', budget:800, type:'Fixed', skills:['SEO','Writing','Content'], posted:Date.now()-3600000*9, proposals:8, status:'open' },
    { id:'j4', clientId:'client1', title:'Node.js API + MongoDB backend', desc:'Build a REST API with authentication, CRUD endpoints, and deployment.', budget:1500, type:'Fixed', skills:['Node.js','MongoDB','API'], posted:Date.now()-3600000*24, proposals:2, status:'open' },
  ]);
  DB.set('proposals', []);
  DB.set('contracts', []);
  DB.set('payments', []);
  DB.set('seeded', true);
}

/* ---------- SESSION ---------- */
function session(){ return DB.get('session', null); }
function me(){ const s = session(); return s ? DB.get('users',{})[s] : null; }
function getUser(id){ return DB.get('users',{})[id]; }
function saveUser(u){ const all = DB.get('users',{}); all[u.id]=u; DB.set('users', all); }
function login(id){
  const users = DB.get('users', {});
  if(!users[id]) return;
  DB.set('session', id);
  renderNav(); router('home'); toast('Signed in as '+users[id].name);
}
function logout(){ DB.set('session', null); renderNav(); router('home'); toast('Signed out'); }

/* ---------- TOAST ---------- */
let toastTimer;
function toast(msg){
  const t = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 3200);
}

/* ---------- MODAL ---------- */
function openModal(html){ document.getElementById('modal').innerHTML = html; document.getElementById('overlay').classList.add('open'); }
function closeModal(){ document.getElementById('overlay').classList.remove('open'); }

/* ---------- HELPERS ---------- */
function timeAgo(ts){
  const s = Math.floor((Date.now()-ts)/1000);
  if(s<60) return s+'s ago';
  if(s<3600) return Math.floor(s/60)+'m ago';
  if(s<86400) return Math.floor(s/3600)+'h ago';
  return Math.floor(s/86400)+'d ago';
}
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------- ROUTER ---------- */
let currentRoute = 'home';
let currentParams = {};
function router(route, params){
  currentRoute = route; currentParams = params || {};
  renderNav(); render();
  window.scrollTo({top:0, behavior:'smooth'});
}

/* ---------- NAV ---------- */
function renderNav(){
  const el = document.getElementById('navLinks');
  const u = me();
  let html = '';
  if(!u){
    html = '<button class="nav-btn" onclick="router(\'jobs\')">Find Jobs</button>'+
           '<button class="nav-btn" onclick="router(\'talents\')">Find Talent</button>'+
           '<button class="nav-btn ghost" onclick="router(\'login\')">Log In</button>'+
           '<button class="nav-btn primary" onclick="router(\'signup\')">Sign Up</button>';
  } else if(u.role === 'freelancer'){
    html = '<button class="nav-btn" onclick="router(\'jobs\')">Find Jobs</button>'+
           '<button class="nav-btn" onclick="router(\'contracts\')">My Contracts</button>'+
           '<span class="badge-connects"><i class="fas fa-bolt"></i> '+u.connects+' Connects</span>'+
           '<button class="nav-btn primary" onclick="router(\'buyConnects\')">Buy Connects</button>'+
           '<div class="avatar" onclick="router(\'profile\')" title="'+esc(u.name)+'">'+esc(u.avatar)+'</div>'+
           '<button class="nav-btn" onclick="logout()" title="Log out"><i class="fas fa-sign-out-alt"></i></button>';
  } else {
    html = '<button class="nav-btn" onclick="router(\'jobs\')">My Jobs</button>'+
           '<button class="nav-btn" onclick="router(\'postJob\')">Post a Job</button>'+
           '<button class="nav-btn" onclick="router(\'contracts\')">Contracts</button>'+
           '<div class="avatar" onclick="router(\'profile\')" title="'+esc(u.name)+'">'+esc(u.avatar)+'</div>'+
           '<button class="nav-btn" onclick="logout()" title="Log out"><i class="fas fa-sign-out-alt"></i></button>';
  }
  el.innerHTML = html;
}

/* ---------- RENDER ---------- */
function render(){
  const app = document.getElementById('app');
  try{
    if(currentRoute==='home') app.innerHTML = viewHome();
    else if(currentRoute==='jobs') app.innerHTML = viewJobs();
    else if(currentRoute==='talents') app.innerHTML = viewTalents();
    else if(currentRoute==='login') app.innerHTML = viewLogin();
    else if(currentRoute==='signup') app.innerHTML = viewSignup();
    else if(currentRoute==='profile') app.innerHTML = viewProfile();
    else if(currentRoute==='postJob') app.innerHTML = viewPostJob();
    else if(currentRoute==='jobDetail') app.innerHTML = viewJobDetail();
    else if(currentRoute==='buyConnects') app.innerHTML = viewBuyConnects();
    else if(currentRoute==='contracts') app.innerHTML = viewContracts();
    else app.innerHTML = viewHome();
  }catch(e){
    console.error(e);
    app.innerHTML = '<div class="page"><div class="empty"><i class="fas fa-exclamation-triangle"></i><h3>Something went wrong</h3><p>'+esc(e.message)+'</p></div></div>';
  }
  if(currentRoute==='buyConnects') initCryptoPaymentUI();
  if(currentRoute==='contracts') startContractClocks();
}

/* ============================================================
   VIEWS
   ============================================================ */

function viewHome(){
  const u = me();
  const jobs = DB.get('jobs', []).filter(j=>j.status==='open').slice(0,4);
  const cards = jobs.map(j=>jobCardHTML(j, u)).join('');
  return '<div class="page">'+
    '<div class="hero">'+
      '<h1>Find work. Hire talent. Build something great.</h1>'+
      '<p>Join thousands of businesses and freelancers collaborating on FreelanceHub — with secure escrow, connects, and real-time contracts.</p>'+
      '<div style="display:flex;gap:.7rem;flex-wrap:wrap">'+
        (u?'':'<button class="btn primary" onclick="router(\'signup\')"><i class="fas fa-rocket"></i> Get Started</button>')+
        '<button class="btn outline" style="background:transparent;color:#fff;border-color:#ffffff40" onclick="router(\'jobs\')"><i class="fas fa-search"></i> Browse Jobs</button>'+
      '</div>'+
    '</div>'+
    '<h2 style="font-size:1.3rem;font-weight:800;margin-bottom:1rem">Latest jobs</h2>'+
    '<div class="grid grid-2">'+cards+'</div>'+
    '<div style="text-align:center;margin-top:1.5rem"><button class="btn outline" onclick="router(\'jobs\')">View all jobs <i class="fas fa-arrow-right"></i></button></div>'+
  '</div>';
}

function viewJobs(){
  const q = (currentParams.q || '').toLowerCase();
  const u = me();
  const jobs = DB.get('jobs', []).filter(j => j.status==='open');
  const filtered = q ? jobs.filter(j =>
    j.title.toLowerCase().includes(q) ||
    j.desc.toLowerCase().includes(q) ||
    j.skills.some(s=>s.toLowerCase().includes(q))
  ) : jobs;
  const cards = filtered.length ? filtered.map(j=>jobCardHTML(j, u)).join('') :
    '<div class="empty" style="grid-column:1/-1"><i class="fas fa-search"></i><h3>No jobs found</h3><p>Try a different search.</p></div>';
  return '<div class="page">'+
    '<h1 style="font-size:1.6rem;font-weight:800;margin-bottom:1rem">Find Jobs</h1>'+
    '<div class="search-row">'+
